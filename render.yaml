# مخطّط نشر Render — خدمة ويب واحدة تخدم الخادم والواجهة معًا (تدعم WebSocket).
services:
  - type: web
    name: aqim-salatak
    runtime: node
    plan: free
    branch: claude/islamic-curriculum-gamification-2blx3m
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
